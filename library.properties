name=JoystickUtilities
version=1.0.0
author=Christoph Streit <christoph.streit@gmail.com>
maintainer=Christoph Streit <christoph.streit@gmail.com>
sentence=Read, calibrate and store analog thumb sticks, with direction keys for menus.
paragraph=Maps each axis to -1000..1000 with a dead zone, averaging and optional inversion. Provides the building blocks of a calibration - averaging the resting position, recording the travel while the stick is swept, checking the result per axis - and leaves the procedure (Serial prompts, a display, buttons) to the sketch. Direction keys with auto-repeat turn a stick into up/down/left/right events. Stores calibrations with Preferences on ESP32. Reads physical joysticks; it does not emulate a USB game controller.
category=Sensors
license=MIT
url=https://github.com/forgevolt/JoystickUtilities
architectures=esp32
includes=JoystickUtilities.h
